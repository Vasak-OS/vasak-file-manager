<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vasak-file-manager</title>
    <script>
      // Reaplica el tema del último arranque (que guardó App.vue) antes de que
      // monte Vue, para que la ventana no abra con el esquema por defecto y vire
      // al del usuario con el fade de 300 ms. El gestor lo corrige después si
      // cambió. La primera vez, sin cache, no hace nada.
      try {
        var tema = JSON.parse(localStorage.getItem("vsk-theme") || "null");
        if (tema) {
          if (tema.dark) document.documentElement.classList.add("dark");
          var vars = tema.vars || {};
          for (var nombre in vars) {
            document.documentElement.style.setProperty(nombre, vars[nombre]);
          }
        }
      } catch (e) {
        /* localStorage puede no estar disponible: sin cache, arranca como antes. */
      }
      // Lo mismo para los ajustes de apariencia (reduce-motion, bajo consumo,
      // tamaño de texto) que guarda user-settings: se reaplican antes de montar
      // para que la ventana no abra con la tipografía y el movimiento por
      // omisión y salte cuando el store termina de cargar.
      try {
        var ajustes = JSON.parse(localStorage.getItem("vsk-settings") || "null");
        if (ajustes) {
          var raiz = document.documentElement;
          raiz.classList.toggle("reduce-motion", !!ajustes.reduceMotion);
          raiz.classList.toggle("low-power", !!ajustes.lowPower);
          var px = { small: "14px", medium: "16px", large: "18px" }[ajustes.textSize];
          if (px) raiz.style.fontSize = px;
        }
      } catch (e) {
        /* sin cache, arranca con el tamaño y el movimiento por omisión. */
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
