[package]
name = "vasak-file-manager"
version = "0.27.0"
description = "A Vasak Application (template)"
authors = ["Vasak Group", "Joaquin (Pato) Decima"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vasak_file_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The XDG base directories, so the rule that a relative variable is ignored is
# not one more hand-written copy. See `open_with::linux::base_xdg`.
dirs = "7"
tauri = { version = "2", features = ["protocol-asset", "devtools", "image-png"] }
webkit2gtk = "2.0"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-vicons = "2.2"
tauri-plugin-config-manager = "2"
# gtk y gio siguen en 0.18 porque es la que trae tauri: subirlas solas deja dos
# generaciones de gtk-rs en el árbol. Suben cuando suba tauri.
gtk = "0.18"
base64 = "0.23"
tauri-plugin-store = "2"
tauri-plugin-i18n-vsk = "2.3.0"
# tauri-plugin-i18n-vsk = { path = "../../tauri-plugin-i18n"}
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-system-fonts = "2"
sysinfo = { version = "0.39", features = ["linux-netdevs"] }
trash = "5.2.5"
png = "0.18"
file_icon_provider = "1.0.0"
image = { version = "0.25", default-features = false, features = ["png"] }
lru = "0.18"
once_cell = "1.19"
# Se queda en 0.22 a propósito: el índice de la búsqueda global vive en disco,
# y pasar a 0.26 es verificar que un índice escrito por la 0.22 se siga abriendo
# —o que se reconstruya sin que nadie lo note—, cosa que no mira ninguna prueba.
# Va en su propio PR; se saca cuando esa verificación esté hecha.
tantivy = "0.22"
walkdir = "2.5"
rayon = "1.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
notify = "8"
# Para `poll()` sobre /proc/self/mountinfo: el kernel avisa con POLLPRI cuando
# cambia la tabla de montajes, y así no hay que sondear las unidades.
libc = "0.2"
tauri-plugin-window-state = "2"
# `ext-idle-notify-v1`: la inactividad de la sesión la sabe el compositor, no la
# ventana. Ver `idle_monitor`.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
tauri-plugin-drag-and-drop-wayland = "2.1"
tauri-plugin-vsk-contextual-menu = "2"
tauri-plugin-vsk-journal = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Los tipos del bus: las rutas de objeto y las variantes de `udisks2`.
zvariant = "5"
gio = "0.18"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1  # Allows LLVM to perform better optimization.
lto = "thin"       # Thin LTO: ~90% de fat LTO, compila mucho más rápido.
opt-level = 3      # Máxima optimización de velocidad.
panic = "abort"    # Higher performance by disabling panic handlers.
strip = true       # Ensures debug symbols are removed.

[dev-dependencies]
# Sólo para el test que valida los catálogos de idioma.
serde_yaml = "0.9"
